version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: faaliyet_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: faaliyet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faaliyet_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=faaliyet_db
      - SECRET_KEY=super-secret-key-change-this-in-production
      - FIRST_SUPERUSER_EMAIL=admin@bursa.bel.tr
      - FIRST_SUPERUSER_PASSWORD=admin123!
    depends_on:
      - db

volumes:
  postgres_data: